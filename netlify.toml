[build]
  command = "pnpm run build && pnpm exec expo export --platform web"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  PNPM_VERSION = "9.12.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=()"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[context.production]
  environment = { REACT_APP_API_URL = "https://your-backend-domain.com", REACT_APP_ENV = "production" }

[context.preview]
  environment = { REACT_APP_API_URL = "https://preview-backend.com", REACT_APP_ENV = "preview" }

[context.deploy-preview]
  environment = { REACT_APP_API_URL = "https://preview-backend.com", REACT_APP_ENV = "preview" }

[context.branch-deploy]
  environment = { REACT_APP_API_URL = "https://preview-backend.com", REACT_APP_ENV = "preview" }
